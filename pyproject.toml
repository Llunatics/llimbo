[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llimbo"
version = "1.0.0"
description = "File carver: recover deleted JPEG, PNG, GIF, PDF and ZIP files from disk images by magic bytes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Llunatics" }]
keywords = ["forensics", "file-carving", "data-recovery", "disk-image", "security", "cli"]
dependencies = []

[project.scripts]
llimbo = "llimbo.cli:main"

[tool.setuptools.packages.find]
include = ["llimbo*"]
